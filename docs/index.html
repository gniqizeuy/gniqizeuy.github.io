":\"-3083.7\"},{\"code\":\"sh600170\",\"name\":\"上海建工\",\"pl\":\"-3062.17\"},{\"code\":\"sh605598\",\"name\":\"上海港湾\",\"pl\":\"-3047.97\"},{\"code\":\"sz001221\",\"name\":\"悍高集团\",\"pl\":\"-3005.64\"},{\"code\":\"sh600589\",\"name\":\"大位科技\",\"pl\":\"-2948.61\"},{\"code\":\"sh600111\",\"name\":\"北方稀土\",\"pl\":\"-2871.97\"},{\"code\":\"sh603332\",\"name\":\"苏州龙杰\",\"pl\":\"-2852.67\"},{\"code\":\"sh600684\",\"name\":\"珠江股份\",\"pl\":\"-2806.37\"},{\"code\":\"sh603878\",\"name\":\"武进不锈\",\"pl\":\"-2776.29\"},{\"code\":\"sz002146\",\"name\":\"荣盛发展\",\"pl\":\"-2483.17\"},{\"code\":\"sz002305\",\"name\":\"*ST南置\",\"pl\":\"-2221.09\"},{\"code\":\"sh600082\",\"name\":\"st海泰\",\"pl\":\"-2060.46\"},{\"code\":\"sh603611\",\"name\":\"诺力股份\",\"pl\":\"-1861.59\"},{\"code\":\"sz000572\",\"name\":\"海马汽车\",\"pl\":\"-1791.33\"},{\"code\":\"sh601965\",\"name\":\"中国汽研\",\"pl\":\"-1231.98\"},{\"code\":\"159937\",\"name\":\"黄金9999\",\"pl\":\"-950.85\"},{\"code\":\"sh600010\",\"name\":\"包钢股份\",\"pl\":\"-919.9\"},{\"code\":\"sz002391\",\"name\":\"长青股份\",\"pl\":\"-859.33\"}]"),
      yh: JSON.parse("[{\"code\":\"sh600573\",\"name\":\"惠泉啤酒\",\"pl\":\"-42605.08\"},{\"code\":\"sh603026\",\"name\":\"石大胜华\",\"pl\":\"-29487.75\"},{\"code\":\"sz002077\",\"name\":\"大港股份\",\"pl\":\"-22883.62\"},{\"code\":\"sh603978\",\"name\":\"深圳新星\",\"pl\":\"-14005.15\"},{\"code\":\"sz002115\",\"name\":\"三维通信\",\"pl\":\"-12745.83\"},{\"code\":\"sz002176\",\"name\":\"江特电机\",\"pl\":\"-12643.48\"},{\"code\":\"sz002153\",\"name\":\"石基信息\",\"pl\":\"-10761.35\"},{\"code\":\"sh603598\",\"name\":\"引力传媒\",\"pl\":\"-10235.37\"},{\"code\":\"sh600711\",\"name\":\"盛屯矿业\",\"pl\":\"-9029.99\"},{\"code\":\"sz002456\",\"name\":\"欧菲光\",\"pl\":\"-9010.68\"},{\"code\":\"sh600714\",\"name\":\"金瑞矿业\",\"pl\":\"-8224.53\"},{\"code\":\"sh603127\",\"name\":\"昭衍新药\",\"pl\":\"-7834.72\"},{\"code\":\"sz002244\",\"name\":\"滨江集团\",\"pl\":\"-7298.16\"},{\"code\":\"sz002575\",\"name\":\"群兴玩具\",\"pl\":\"-6936.24\"},{\"code\":\"sh603360\",\"name\":\"百傲化学\",\"pl\":\"-6826.75\"},{\"code\":\"sz002413\",\"name\":\"雷科防务\",\"pl\":\"-6404.94\"},{\"code\":\"sz001330\",\"name\":\"博纳影业\",\"pl\":\"-6012.56\"},{\"code\":\"sz000060\",\"name\":\"中金岭南\",\"pl\":\"-5233.46\"},{\"code\":\"sh601212\",\"name\":\"白银有色\",\"pl\":\"-4655.88\"},{\"code\":\"sz002241\",\"name\":\"歌尔股份\",\"pl\":\"-4353.57\"},{\"code\":\"sh603530\",\"name\":\"神马电力\",\"pl\":\"-3808.32\"},{\"code\":\"sz002467\",\"name\":\"二六三\",\"pl\":\"-3760.04\"},{\"code\":\"sh600635\",\"name\":\"大众公用\",\"pl\":\"-3600.14\"},{\"code\":\"sh601061\",\"name\":\"中信金属\",\"pl\":\"-3069.13\"},{\"code\":\"sz002596\",\"name\":\"海南瑞泽\",\"pl\":\"-2994.63\"},{\"code\":\"sh600960\",\"name\":\"渤海汽车\",\"pl\":\"-2834.51\"},{\"code\":\"sh600686\",\"name\":\"金龙汽车\",\"pl\":\"-2821.15\"},{\"code\":\"sh600163\",\"name\":\"中闽能源\",\"pl\":\"-2683.58\"},{\"code\":\"sz002556\",\"name\":\"辉隆股份\",\"pl\":\"-2042.02\"},{\"code\":\"sz000027\",\"name\":\"深圳能源\",\"pl\":\"-1887.11\"},{\"code\":\"sz003037\",\"name\":\"三和管桩\",\"pl\":\"-1807.93\"},{\"code\":\"sh603908\",\"name\":\"牧高笛\",\"pl\":\"-1711.88\"},{\"code\":\"sh562970\",\"name\":\"光伏E\",\"pl\":\"-1570.33\"},{\"code\":\"sh601686\",\"name\":\"友发集团\",\"pl\":\"-1125.8\"}]"),
    };
    const viewState = {
      gf: { sortKey: 'pl', type: 'amount', order: 'desc' },
      yh: { sortKey: 'pl', type: 'amount', order: 'desc' },
      all: { sortKey: 'net', type: 'amount', order: 'desc' },
    };
    const viewConfig = {
      gf: {
        title: 'GF',
        columns: [
          { key: 'name', label: 'Security', className: '' },
          { key: 'pl', label: 'Amount', type: 'amount', className: 'num-th' },
        ],
      },
      yh: {
        title: 'YH',
        columns: [
          { key: 'name', label: 'Security', className: '' },
          { key: 'pl', label: 'Amount', type: 'amount', className: 'num-th' },
        ],
      },
      all: {
        title: 'ALL',
        columns: [
          { key: 'name', label: 'Security', className: '' },
          { key: 'net', label: 'Net Loss', type: 'amount', className: 'num-th' },
          { key: 'src', label: 'Source', className: 'center-th' },
        ],
      },
    };

    let activeView = 'gf';
    let nameFilter = '';

    function isMarketSymbol(symbol) {
      return /^(sh|sz|bj)\d{6}$/i.test(symbol || '');
    }

    function getSummaryRows() {
      const totals = new Map();
      const srcs = new Map();
      const codes = new Map();
      datasets.gf.forEach(row => {
        const key = row.name?.trim();
        if (!key) return;
        totals.set(key, (totals.get(key) || 0) + parseNumericValue(row.pl));
        srcs.set(key, 'GF');
        if (!codes.get(key) && isMarketSymbol(row.code)) codes.set(key, row.code);
      });
      datasets.yh.forEach(row => {
        const key = row.name?.trim();
        if (!key) return;
        totals.set(key, (totals.get(key) || 0) + parseNumericValue(row.pl));
        const existing = srcs.get(key);
        srcs.set(key, existing && existing !== 'YH' ? 'GF+YH' : 'YH');
        if (!codes.get(key) && isMarketSymbol(row.code)) codes.set(key, row.code);
      });
      return Array.from(totals.entries()).map(([name, net]) => ({
        code: codes.get(name) || '',
        name,
        net: net.toFixed(2),
        src: srcs.get(name) || '',
      }));
    }

    function getRows(view) {
      return view === 'all' ? getSummaryRows() : datasets[view];
    }

    function getFilteredRows(view) {
      const keyword = nameFilter.trim().toLocaleLowerCase();
      const rows = getRows(view);
      if (!keyword) return rows;
      return rows.filter(row => {
        return (row.name || '').toLocaleLowerCase().includes(keyword) ||
               (row.code || '').toLocaleLowerCase().includes(keyword);
      });
    }

    function getTotalValue(view, filtered = false) {
      const rows = filtered ? getFilteredRows(view) : getRows(view);
      return rows.reduce((sum, row) => {
        const key = view === 'all' ? 'net' : 'pl';
        return sum + parseNumericValue(row[key]);
      }, 0);
    }

    function buildColGroup(view) {
      const widths = view === 'all' ? ['52%', '30%', '18%'] : ['65%', '35%'];
      return widths.map(width => `<col style="width:${width}">`).join('');
    }

    function buildHead(view) {
      const { columns } = viewConfig[view];
      const sort = viewState[view];
      const headers = columns.map(column => {
        if (!column.type) return `<th class="${column.className || ''}">${column.label}</th>`;
        const isActive = sort.sortKey === column.key;
        const arrow = isActive ? (sort.order === 'asc' ? '▲' : '▼') : '↕';
        return `
          <th class="${column.className || ''}">
            <div class="sortable-col" onclick="toggleSort('${column.key}', '${column.type}')" style="justify-content: flex-end;">
              <span>${column.label}</span>
              <span class="sort-indicator ${isActive ? 'active' : ''}">${arrow}</span>
            </div>
          </th>`;
      });
      return `<tr>${headers.join('')}</tr>`;
    }

    function buildBody(view) {
      const rows = getSortedRows(view);
      const colCount = viewConfig[view].columns.length;
      if (!rows.length) return `<tr><td class="empty-state" colspan="${colCount}">No records found</td></tr>`;
      return rows.map(row => {
        const cells = [];
        cells.push(renderNameCell(row));
        if (view === 'all') {
          cells.push(`<td class="amount-value num-cell">${escapeHtml(row.net)}</td>`);
          cells.push(`<td class="center-cell"><span class="src-badge">${escapeHtml(row.src)}</span></td>`);
        } else {
          cells.push(`<td class="amount-value num-cell">${escapeHtml(row.pl)}</td>`);
        }
        return `<tr>${cells.join('')}</tr>`;
      }).join('');
    }

    function renderNameCell(row) {
      const codePart = row.code ? `<span class="stock-code">${escapeHtml(row.code)}</span>` : '';
      return `<td><div class="stock-title"><span class="stock-name">${escapeHtml(row?.name || '')}</span>${codePart}</div></td>`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getSortedRows(view) {
      const rows = [...getFilteredRows(view)];
      const { sortKey, type, order } = viewState[view];
      rows.sort((a, b) => {
        const av = getValueForSort(a[sortKey], type);
        const bv = getValueForSort(b[sortKey], type);
        if (av !== bv) return order === 'desc' ? bv - av : av - bv;
        return (a.name || '').localeCompare(b.name || '', 'zh-Hans-CN');
      });
      return rows;
    }

    function getValueForSort(value, type) {
      const parsed = parseNumericValue(value);
      if (type === 'amount') return parsed < 0 ? Math.abs(parsed) : parsed;
      return parsed;
    }

    function toggleSort(sortKey, type) {
      const current = viewState[activeView];
      if (current.sortKey === sortKey) {
        current.order = current.order === 'desc' ? 'asc' : 'desc';
      } else {
        viewState[activeView] = { sortKey, type, order: 'desc' };
      }
      renderView();
    }

    function renderView() {
      const rows = getFilteredRows(activeView);
      const totalRows = getRows(activeView).length;
      const hasFilter = Boolean(nameFilter.trim());
      
      document.getElementById('table-cols').innerHTML = buildColGroup(activeView);
      document.getElementById('table-head').innerHTML = buildHead(activeView);
      document.getElementById('table-body').innerHTML = buildBody(activeView);
      
      document.getElementById('footer-count').textContent = hasFilter
        ? `FILTERED: ${rows.length} / ${totalRows}`
        : `TOTAL: ${rows.length} ENTRIES`;
      document.getElementById('footer-subtotal').textContent = `SUBTOTAL: ${getTotalValue(activeView, true).toFixed(2)}`;
      syncFilterUi();
    }

    function setView(view, tabEl) {
      activeView = view;
      document.querySelectorAll('.segment-tab').forEach(el => {
        el.classList.toggle('is-active', el === tabEl);
      });
      renderView();
    }

    function syncFilterUi() {
      const input = document.getElementById('name-filter');
      const clear = document.getElementById('name-filter-clear');
      if (!input || !clear) return;
      input.value = nameFilter;
      clear.hidden = !nameFilter.trim();
    }

    function handleFilterInput(value) {
      nameFilter = value;
      renderView();
    }

    function clearFilter() {
      nameFilter = '';
      renderView();
      const input = document.getElementById('name-filter');
      if (input) input.focus();
    }

    function normalizeNumericText(text) {
      const raw = (text || '').replace(/,/g, '').replace(/%/g, '').replace(/\s+/g, '');
      const sign = raw.startsWith('-') ? '-' : '';
      let body = raw.replace(/^[+-]/, '');
      const parts = body.split('.');
      if (parts.length > 1) body = `${parts[0]}.${parts.slice(1).join('')}`;
      return `${sign}${body}`;
    }

    function parseNumericValue(text) {
      const value = Number.parseFloat(normalizeNumericText(text));
      return Number.isFinite(value) ? value : 0;
    }

    renderView();
  </script>
