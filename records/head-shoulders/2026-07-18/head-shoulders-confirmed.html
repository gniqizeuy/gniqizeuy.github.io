  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  const root = document.getElementById(&quot;hs-confirmed-charts&quot;);
  const grid = document.getElementById(&quot;hs-chart-grid&quot;);
  if (!root || !grid) return;

  const NS = &quot;http://www.w3.org/2000/svg&quot;;
  const make = (tag, attrs = {}, text = null) =&gt; {
    const node = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, String(value));

  const formatPrice = (value) =&gt; value &gt;= 100 ? value.toFixed(1) : value &gt;= 10 ? value.toFixed(2) : value.toFixed(3).replace(/0+$/, &quot;&quot;).replace(/\.$/, &quot;&quot;);

  const scale = (domainMin, domainMax, rangeMin, rangeMax) =&gt; (value) =&gt; {

    return rangeMin + ratio * (rangeMax - rangeMin);
  };

  const panels = DATA.map((chart) =&gt; {
    const panel = document.createElement(&quot;section&quot;);
    panel.className = &quot;hs-panel&quot;;
    const header = document.createElement(&quot;div&quot;);
    header.className = &quot;hs-panel-header&quot;;
    const title = document.createElement(&quot;h3&quot;);
    title.textContent = `${chart.name} ${chart.symbol.slice(2)}`;
    const badge = document.createElement(&quot;span&quot;);
    badge.className = &quot;viz-badge&quot;;
    badge.textContent = chart.status;
    header.append(title, badge);

    const plot = document.createElement(&quot;div&quot;);
    plot.className = &quot;hs-plot&quot;;
    panel.append(header, meta, plot);
    grid.append(panel);
    return { chart, plot };

  function render({ chart, plot }) {
    const width = Math.max(280, Math.floor(plot.clientWidth || 680));
    const height = width &lt; 420 ? 300 : 320;
    const margin = { left: width &lt; 420 ? 46 : 54, right: 16, top: 18, bottom: 28 };
    const priceBottom = height - 86;
    const volumeTop = height - 62;
    const volumeBottom = height - margin.bottom;
    const xMin = chart.bars[0].i;
    const xMax = chart.bars.at(-1).i;
    const n1 = chart.points.n1;
    const n2 = chart.points.n2;
    const neckSlope = (n2.price - n1.price) / Math.max(1, n2.index - n1.index);
    const neckEnd = n1.price + neckSlope * (xMax - n1.index);

    let yMax = Math.max(...allPrices);

    yMin -= pad;
    yMax += pad;
    const volumeMax = Math.max(...chart.bars.map((bar) =&gt; bar.v));
    const x = scale(xMin, xMax, margin.left, width - margin.right);
    const y = scale(yMin, yMax, priceBottom, margin.top);
    const volumeY = scale(0, volumeMax, volumeBottom, volumeTop);
    const svg = make(&quot;svg&quot;, {
      viewBox: `0 0 ${width} ${height}`,
      role: &quot;img&quot;,
      &quot;aria-label&quot;: `${chart.name}前复权日线头肩顶图，标注左肩、头部、右肩、颈线与破位点`,
    });
    svg.append(make(&quot;title&quot;, {}, `${chart.name}头肩顶形态`));
    svg.append(make(&quot;desc&quot;, {}, `截至${chart.latest.date}，最新收盘${formatPrice(chart.latest.close)}，${chart.status}`));

    for (let step = 0; step &lt;= 4; step += 1) {
      const value = yMin + (yMax - yMin) * step / 4;
      const yy = y(value);

    }
    svg.append(make(&quot;line&quot;, { x1: margin.left, y1: priceBottom, x2: width - margin.right, y2: priceBottom, class: &quot;hs-axis&quot; }));
    svg.append(make(&quot;line&quot;, { x1: margin.left, y1: volumeBottom, x2: width - margin.right, y2: volumeBottom, class: &quot;hs-axis&quot; }));

    const barWidth = Math.max(1, (width - margin.left - margin.right) / chart.bars.length * 0.72);
    for (const bar of chart.bars) {
      const bx = x(bar.i) - barWidth / 2;
      const by = volumeY(bar.v);
      svg.append(make(&quot;rect&quot;, { x: bx, y: by, width: barWidth, height: volumeBottom - by, class: &quot;hs-volume&quot; }));
    }
    const pricePath = chart.bars.map((bar, index) =&gt; `${index === 0 ? &quot;M&quot; : &quot;L&quot;}${x(bar.i).toFixed(2)},${y(bar.c).toFixed(2)}`).join(&quot; &quot;);
    svg.append(make(&quot;path&quot;, { d: pricePath, class: &quot;hs-price&quot; }));
    svg.append(make(&quot;line&quot;, { x1: x(n1.index), y1: y(n1.price), x2: x(xMax), y2: y(neckEnd), class: &quot;hs-neck&quot; }));

    const addPoint = (point, label, type) =&gt; {
      const px = x(point.index);
      const py = y(point.price ?? point.close);
      if (type === &quot;shoulder&quot;) svg.append(make(&quot;circle&quot;, { cx: px, cy: py, r: 5, class: &quot;hs-shoulder&quot; }));
      if (type === &quot;head&quot;) svg.append(make(&quot;polygon&quot;, { points: `${px},${py-7} ${px+7},${py} ${px},${py+7} ${px-7},${py}`, class: &quot;hs-head&quot; }));
      if (type === &quot;break&quot;) svg.append(make(&quot;polygon&quot;, { points: `${px},${py+7} ${px-7},${py-6} ${px+7},${py-6}`, class: &quot;hs-break&quot; }));
      const labelY = type === &quot;break&quot; ? py + 20 : py - 11;
      svg.append(make(&quot;text&quot;, { x: px, y: labelY, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;hs-label&quot; }, label));
    };
    addPoint(chart.points.ls, &quot;左肩&quot;, &quot;shoulder&quot;);
    addPoint(chart.points.h, &quot;头&quot;, &quot;head&quot;);
    addPoint(chart.points.rs, &quot;右肩&quot;, &quot;shoulder&quot;);
    addPoint(chart.points.b, &quot;破位&quot;, &quot;break&quot;);

    const tickCount = width &lt; 420 ? 3 : 5;
    for (let step = 0; step &lt; tickCount; step += 1) {
      const index = Math.round(step * (chart.bars.length - 1) / (tickCount - 1));
      const bar = chart.bars[index];
      const tx = x(bar.i);
      svg.append(make(&quot;line&quot;, { x1: tx, y1: volumeBottom, x2: tx, y2: volumeBottom + 4, class: &quot;hs-axis&quot; }));

    }
    svg.append(make(&quot;text&quot;, { x: margin.left, y: volumeTop - 6, class: &quot;hs-tick&quot; }, &quot;成交量&quot;));
    plot.replaceChildren(svg);
  }

  const observer = new ResizeObserver((entries) =&gt; {
    for (const entry of entries) {
      const panel = panels.find((item) =&gt; item.plot === entry.target);
      if (panel) render(panel);
    }
  });
  for (const panel of panels) observer.observe(panel.plot);
  requestAnimationFrame(() =&gt; panels.forEach(render));
})();
